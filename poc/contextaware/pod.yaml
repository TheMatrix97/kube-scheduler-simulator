apiVersion: v1
kind: Pod
metadata:
  name: pod2
  annotations:
    kontext.io/required-karma: "0.8" # Minimum karma required for scheduling
    kontext.io/max-cost-total: "1.3" # Maximum cost total
spec:
  containers:
  - name: nginx
    image: nginx:1.14.2
    ports:
    - containerPort: 80